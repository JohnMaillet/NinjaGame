<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ninja Attack!</title>
<style>
html, body {
  height: 100%;
  overflow: hidden;
}

#scene {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -2;
}

#ninja {
  width: 46px;
  height: 50px;
  background: url(Resources/Images/Ninja_Sprites.gif) -126px 0;
}

#pow {
  width: 60px;
  height: 50px;
  background: url(Resources/Images/Ninja_Sprites.gif) -230px 0px;
}
.imgContainer{
    float:left;
}

#musicBtn {
  position: fixed;
  top: 12px;
  right: 12px;
  padding: 6px 14px;
  font: 14px/1.2 "Segoe UI", system-ui, sans-serif;
  color: #ffe8c2;
  background: rgba(43, 27, 74, 0.75);
  border: 1px solid rgba(255, 220, 180, 0.5);
  border-radius: 999px;
  cursor: pointer;
}
#musicBtn:hover {
  background: rgba(43, 27, 74, 0.9);
}

#hint {
  position: fixed;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font: 13px/1.2 "Segoe UI", system-ui, sans-serif;
  color: rgba(70, 30, 45, 0.75);
  pointer-events: none;
}

#front {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 5;
  pointer-events: none;
}

#musicBtn, #hint {
  z-index: 6;
}

#starCount {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 6;
  padding: 6px 14px;
  font: 14px/1.2 "Segoe UI", system-ui, sans-serif;
  color: #ffe8c2;
  background: rgba(43, 27, 74, 0.75);
  border: 1px solid rgba(255, 220, 180, 0.5);
  border-radius: 999px;
}
#starCount[hidden] {
  display: none;
}

#moves {
  position: absolute;
  width: 64px;
  height: 50px;
  background: url(Resources/Images/Ninja_Moves.png) 0 0;
  display: none;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="front"></canvas>
<div class="imgContainer">
	<img id="ninja" src="Resources/Images/img_trans.gif" width="1" height="1"><br><br>
</div>
<div id="moves"></div>
<div class="imgContainer">
	<img id="pow" src="Resources/Images/img_trans.gif" width="1" height="1"><br><br>
</div>
<button id="musicBtn" type="button">&#9835; Music: On</button>
<div id="starCount" hidden></div>
<div id="hint">&larr; &rarr;: walk &middot; Shift: run &middot; Space: jump (hold an arrow to jump sideways) &middot; K: side kick &middot; R: roundhouse &middot; F: flying kick &middot; attack mid-jump &middot; kick the gate for ninja stars, T: throw &middot; hold S: stealth &middot; other keys: punch</div>
</body>

<script>
	// ---- Side-scrolling sunset dojo ----
	// The world scrolls sideways as the ninja walks, like an old side-scroller. Each layer moves at
	// its own speed ("depth", where 1 = the path the ninja walks on): the sky stays put, mountains
	// creep by, torii gates move faster, lanterns and bamboo beside the path faster still, and
	// cherry trees and grass drawn in front of the ninja move fastest. That difference sells the depth.
	var scene = (function(){
		var canvas = document.getElementById("scene");
		var ctx = canvas.getContext("2d");
		var frontCanvas = document.getElementById("front");
		var fctx = frontCanvas.getContext("2d");
		var ninja = document.getElementById("ninja");
		var W, H, horizon, groundY, scale;
		var cameraX = 0, lastCameraX = 0;
		var stars = [], clouds = [], petals = [], sparks = [], trees = [];
		var shuriken = [], thrown = [], collectHandler = null, gateShake = 0, lastGateKick = -1;
		var flash = 0, shake = 0, time = 0, last = performance.now(), shadowY = null;

		function seeded(seed){
			return function(){
				seed = (seed * 16807) % 2147483647;
				return (seed - 1) / 2147483646;
			};
		}

		// Repeatable pseudo-random number in [0, 1) for a given number
		function hash(n){
			var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
			return x - Math.floor(x);
		}

		// A cherry tree shape in local units (trunk base at 0, 0; about 450 units tall)
		function makeTree(seed){
			var rnd = seeded(seed), shape = { branches: [], blossoms: [] };
			(function grow(x, y, angle, len, width, depth){
				var x2 = x + Math.cos(angle) * len;
				var y2 = y + Math.sin(angle) * len;
				shape.branches.push({ x1: x, y1: y, x2: x2, y2: y2, w: width });
				if (depth === 0) {
					shape.blossoms.push({ x: x2, y: y2, r: 16 + rnd() * 12 });
					return;
				}
				if (depth < 3) {
					shape.blossoms.push({ x: (x + x2) / 2, y: (y + y2) / 2, r: 12 + rnd() * 9 });
				}
				grow(x2, y2, angle - 0.3 - rnd() * 0.3, len * 0.74, width * 0.66, depth - 1);
				grow(x2, y2, angle + 0.3 + rnd() * 0.3, len * 0.7, width * 0.66, depth - 1);
			})(0, 0, -Math.PI / 2 + (rnd() - 0.5) * 0.5, 150, 24, 6);
			return shape;
		}

		function newPetal(rnd, anywhere){
			return {
				x: anywhere ? rnd() * W : W * (0.3 + rnd() * 0.8),
				y: anywhere ? rnd() * H : -20 + rnd() * H * 0.4,
				vx: -30 - rnd() * 40,
				vy: 25 + rnd() * 35,
				rot: rnd() * 6.28,
				vr: -2 + rnd() * 4,
				size: 3 + rnd() * 3,
				sway: rnd() * 6.28
			};
		}

		function sizeCanvas(c, context, dpr){
			c.width = Math.round(W * dpr);
			c.height = Math.round(H * dpr);
			c.style.width = W + "px";
			c.style.height = H + "px";
			context.setTransform(dpr, 0, 0, dpr, 0, 0);
		}

		function resize(){
			var dpr = window.devicePixelRatio || 1;
			W = window.innerWidth;
			H = window.innerHeight;
			sizeCanvas(canvas, ctx, dpr);
			sizeCanvas(frontCanvas, fctx, dpr);
			horizon = H * 0.68;
			groundY = H * 0.8;
			scale = Math.min(W, H) / 800;

			var rnd = seeded(7);
			stars = [];
			for (var i = 0; i < 90; i++) {
				stars.push({ x: rnd() * W, y: rnd() * horizon * 0.5, s: 0.4 + rnd() * 1.3, t: rnd() * 6.28 });
			}
			clouds = [];
			for (var c = 0; c < 6; c++) {
				clouds.push({ x: rnd() * W, y: H * 0.14 + rnd() * (horizon - H * 0.38), w: 120 + rnd() * 220, h: 6 + rnd() * 8, v: 4 + rnd() * 10 });
			}
			if (trees.length === 0) {
				for (var t = 0; t < 3; t++) trees.push(makeTree(11 + t * 17));
			}
			if (petals.length === 0) {
				for (var p = 0; p < 50; p++) petals.push(newPetal(Math.random, true));
			}
		}

		// Calls draw(screenX, r1, r2) for every prop slot of a layer that's near the screen.
		// Slots repeat forever, and r1/r2 are stable random numbers for that slot.
		function eachProp(depth, spacing, margin, seed, draw){
			var off = cameraX * depth;
			var first = Math.floor((off - margin - spacing) / spacing);
			var lastSlot = Math.floor((off + W + margin) / spacing);
			for (var i = first; i <= lastSlot; i++) {
				var r1 = hash(i * 13 + seed), r2 = hash(i * 7 + seed * 31);
				draw(i * spacing + r1 * spacing * 0.5 - off, r1, r2);
			}
		}

		// Rolling hills that go on forever as the camera moves
		function drawHills(depth, base, amp, seed, color){
			var off = cameraX * depth;
			ctx.fillStyle = color;
			ctx.beginPath();
			ctx.moveTo(-20, H);
			for (var sx = -20; sx <= W + 20; sx += 10) {
				var x = sx + off;
				var wave = 0.5 + 0.28 * Math.sin(x * 0.004 + seed) + 0.14 * Math.sin(x * 0.011 + seed * 2.3) + 0.08 * Math.sin(x * 0.027 + seed * 5.1);
				ctx.lineTo(sx, base - amp * wave);
			}
			ctx.lineTo(W + 20, H);
			ctx.closePath();
			ctx.fill();
		}

		function drawFuji(cx){
			var h = H * 0.36;
			var bw = Math.min(W * 0.34, h * 1.9);
			var peak = horizon - h;
			ctx.save();
			ctx.beginPath();
			ctx.moveTo(cx - bw, horizon);
			ctx.quadraticCurveTo(cx - bw * 0.35, horizon - h * 0.55, cx - bw * 0.1, peak);
			ctx.lineTo(cx + bw * 0.1, peak);
			ctx.quadraticCurveTo(cx + bw * 0.35, horizon - h * 0.55, cx + bw, horizon);
			ctx.closePath();
			ctx.fillStyle = "#9a5a86";
			ctx.fill();
			ctx.clip();
			// Snow cap with a jagged lower edge
			ctx.fillStyle = "#fbe7ef";
			ctx.beginPath();
			ctx.moveTo(cx - bw, peak - 10);
			ctx.lineTo(cx + bw, peak - 10);
			var capY = peak + h * 0.24;
			for (var i = 10; i >= 0; i--) {
				var x = cx - bw * 0.5 + bw * i / 10;
				ctx.lineTo(x, capY + (i % 2 ? h * 0.07 : 0));
			}
			ctx.closePath();
			ctx.fill();
			ctx.restore();
		}

		function drawPagoda(x, baseY, s, color){
			ctx.fillStyle = color;
			// Mound so the pagoda never floats above a dip in the hills
			ctx.fillRect(x - 34 * s, baseY, 68 * s, H * 0.06);
			var y = baseY;
			for (var k = 0; k < 5; k++) {
				var tw = (64 - k * 9) * s;
				var bodyH = 13 * s;
				var roofH = 7 * s;
				ctx.fillRect(x - tw * 0.3, y - bodyH, tw * 0.6, bodyH);
				ctx.beginPath();
				ctx.moveTo(x - tw / 2 - 5 * s, y - bodyH - 1 * s);
				ctx.quadraticCurveTo(x - tw * 0.32, y - bodyH, x - tw * 0.24, y - bodyH - roofH);
				ctx.lineTo(x + tw * 0.24, y - bodyH - roofH);
				ctx.quadraticCurveTo(x + tw * 0.32, y - bodyH, x + tw / 2 + 5 * s, y - bodyH - 1 * s);
				ctx.closePath();
				ctx.fill();
				y -= bodyH + roofH;
			}
			ctx.fillRect(x - 1.5 * s, y - 22 * s, 3 * s, 22 * s);
		}

		function drawTorii(x, baseY, h){
			ctx.fillStyle = "rgba(80, 30, 40, 0.18)";
			ctx.beginPath();
			ctx.ellipse(x, baseY + 2, h * 0.55, h * 0.05, 0, 0, Math.PI * 2);
			ctx.fill();

			var post = h * 0.07;
			ctx.fillStyle = "#c7362f";
			ctx.fillRect(x - h * 0.36 - post / 2, baseY - h * 0.88, post, h * 0.88);
			ctx.fillRect(x + h * 0.36 - post / 2, baseY - h * 0.88, post, h * 0.88);
			ctx.fillRect(x - h * 0.5, baseY - h * 0.72, h, h * 0.05);
			ctx.fillRect(x - h * 0.52, baseY - h * 0.87, h * 1.04, h * 0.055);
			ctx.fillRect(x - h * 0.025, baseY - h * 0.82, h * 0.05, h * 0.1);

			ctx.fillStyle = "#2a1a22";
			ctx.beginPath();
			ctx.moveTo(x - h * 0.62, baseY - h * 0.98);
			ctx.quadraticCurveTo(x, baseY - h * 0.88, x + h * 0.62, baseY - h * 0.98);
			ctx.lineTo(x + h * 0.56, baseY - h * 0.9);
			ctx.quadraticCurveTo(x, baseY - h * 0.82, x - h * 0.56, baseY - h * 0.9);
			ctx.closePath();
			ctx.fill();
		}

		function drawTree(g, shape, x, baseY, s){
			g.save();
			g.translate(x, baseY);
			g.scale(s, s);
			g.lineCap = "round";
			g.strokeStyle = "#3d2230";
			for (var i = 0; i < shape.branches.length; i++) {
				var b = shape.branches[i];
				g.lineWidth = Math.max(1 / s, b.w);
				g.beginPath();
				g.moveTo(b.x1, b.y1);
				g.lineTo(b.x2, b.y2);
				g.stroke();
			}
			var pinks = ["#f48fb1", "#f7a8c4", "#ffd1e0"];
			for (var j = 0; j < shape.blossoms.length; j++) {
				var bl = shape.blossoms[j];
				for (var k = 0; k < 3; k++) {
					g.fillStyle = pinks[k];
					g.beginPath();
					g.arc(bl.x + (k - 1) * bl.r * 0.45, bl.y - k * bl.r * 0.3, bl.r * (1 - k * 0.22), 0, Math.PI * 2);
					g.fill();
				}
			}
			g.restore();
		}

		function drawStoneLantern(x, baseY, s){
			var glow = ctx.createRadialGradient(x, baseY - 56 * s, 2, x, baseY - 56 * s, 34 * s);
			glow.addColorStop(0, "rgba(255, 200, 110, 0.45)");
			glow.addColorStop(1, "rgba(255, 200, 110, 0)");
			ctx.fillStyle = glow;
			ctx.fillRect(x - 34 * s, baseY - 90 * s, 68 * s, 68 * s);
			ctx.fillStyle = "#6f6275";
			ctx.fillRect(x - 16 * s, baseY - 8 * s, 32 * s, 8 * s);
			ctx.fillRect(x - 5 * s, baseY - 40 * s, 10 * s, 32 * s);
			ctx.fillRect(x - 14 * s, baseY - 46 * s, 28 * s, 6 * s);
			ctx.fillRect(x - 11 * s, baseY - 66 * s, 22 * s, 20 * s);
			ctx.fillStyle = "#ffd27a";
			ctx.fillRect(x - 5 * s, baseY - 62 * s, 10 * s, 12 * s);
			ctx.fillStyle = "#5a4e60";
			ctx.beginPath();
			ctx.moveTo(x - 22 * s, baseY - 66 * s);
			ctx.lineTo(x + 22 * s, baseY - 66 * s);
			ctx.lineTo(x + 8 * s, baseY - 78 * s);
			ctx.lineTo(x - 8 * s, baseY - 78 * s);
			ctx.closePath();
			ctx.fill();
			ctx.fillRect(x - 3 * s, baseY - 86 * s, 6 * s, 8 * s);
		}

		function drawBamboo(g, x, baseY, s, r){
			var stalks = 3 + Math.floor(r * 3);
			for (var i = 0; i < stalks; i++) {
				var sx = x + (i - stalks / 2) * 11 * s;
				var h = (130 + hash(i * 5 + r * 1000) * 90) * s;
				g.fillStyle = i % 2 ? "#5f8c46" : "#4d7a3a";
				g.fillRect(sx - 3.5 * s, baseY - h, 7 * s, h);
				g.fillStyle = "rgba(30, 50, 20, 0.45)";
				for (var n = baseY - 28 * s; n > baseY - h; n -= 28 * s) g.fillRect(sx - 4 * s, n, 8 * s, 2 * s);
				g.fillStyle = "#6fa052";
				for (var l = 0; l < 3; l++) {
					g.beginPath();
					g.ellipse(sx + (l - 1) * 9 * s, baseY - h + l * 10 * s, 11 * s, 3 * s, (l - 1) * 0.6, 0, Math.PI * 2);
					g.fill();
				}
			}
		}

		function drawBush(x, baseY, s){
			ctx.fillStyle = "#5b7d44";
			[[-18, -14, 18], [0, -22, 22], [18, -13, 17]].forEach(function(b){
				ctx.beginPath();
				ctx.arc(x + b[0] * s, baseY + b[1] * s, b[2] * s, 0, Math.PI * 2);
				ctx.fill();
			});
			ctx.fillStyle = "#f7a8c4";
			for (var i = 0; i < 5; i++) {
				ctx.beginPath();
				ctx.arc(x + (i * 11 - 22) * s, baseY - (18 + (i % 2) * 10) * s, 2.5 * s, 0, Math.PI * 2);
				ctx.fill();
			}
		}

		function drawFence(x, baseY, s){
			ctx.fillStyle = "#6b4a3a";
			ctx.fillRect(x - 60 * s, baseY - 44 * s, 6 * s, 44 * s);
			ctx.fillRect(x + 54 * s, baseY - 44 * s, 6 * s, 44 * s);
			ctx.fillRect(x - 64 * s, baseY - 38 * s, 128 * s, 5 * s);
			ctx.fillRect(x - 64 * s, baseY - 22 * s, 128 * s, 5 * s);
		}

		// The kickable torii gate standing on the path in the first screen
		function gate(){
			return { x: W * 0.66 - cameraX, base: groundY + 6, h: H * 0.26 };
		}

		function drawShuriken(g, x, y, r, rot){
			g.save();
			g.translate(x, y);
			g.rotate(rot);
			g.fillStyle = "#3b3f4a";
			g.beginPath();
			for (var i = 0; i < 8; i++) {
				var a = i * Math.PI / 4, reach = i % 2 ? r * 0.35 : r;
				g.lineTo(Math.cos(a) * reach, Math.sin(a) * reach);
			}
			g.closePath();
			g.fill();
			g.strokeStyle = "rgba(220, 225, 235, 0.8)";
			g.lineWidth = 1;
			g.stroke();
			g.fillStyle = "#c9ccd6";
			g.beginPath();
			g.arc(0, 0, r * 0.18, 0, Math.PI * 2);
			g.fill();
			g.restore();
		}

		// The stone path the ninja walks on; its tile seams move exactly with the ninja
		function drawPath(){
			var top = groundY - 4, h = Math.max(16, 22 * scale);
			ctx.fillStyle = "#dcb98f";
			ctx.fillRect(-20, top, W + 40, h);
			ctx.fillStyle = "rgba(120, 70, 50, 0.35)";
			ctx.fillRect(-20, top, W + 40, 2);
			ctx.fillRect(-20, top + h - 2, W + 40, 2);
			var tile = 56, offset = ((cameraX % tile) + tile) % tile;
			ctx.fillStyle = "rgba(120, 70, 50, 0.28)";
			for (var tx = -offset; tx < W + tile; tx += tile) ctx.fillRect(Math.round(tx), top + 2, 2, h - 4);
		}

		function drawLantern(x, y, i){
			ctx.save();
			ctx.translate(x, y);
			ctx.rotate(Math.sin(time * 1.4 + i * 1.7) * 0.09);

			var glow = ctx.createRadialGradient(0, 24, 4, 0, 24, 44);
			glow.addColorStop(0, "rgba(255, 190, 90, 0.45)");
			glow.addColorStop(1, "rgba(255, 190, 90, 0)");
			ctx.fillStyle = glow;
			ctx.fillRect(-44, -20, 88, 88);

			ctx.strokeStyle = "rgba(40, 20, 30, 0.8)";
			ctx.lineWidth = 1.5;
			ctx.beginPath();
			ctx.moveTo(0, 0);
			ctx.lineTo(0, 10);
			ctx.stroke();
			ctx.fillStyle = "#2a1a22";
			ctx.fillRect(-6, 9, 12, 4);
			ctx.fillRect(-6, 37, 12, 4);
			ctx.fillStyle = "#e2483c";
			ctx.beginPath();
			ctx.ellipse(0, 25, 13, 13, 0, 0, Math.PI * 2);
			ctx.fill();
			ctx.strokeStyle = "rgba(120, 20, 20, 0.5)";
			ctx.lineWidth = 1;
			for (var r = -8; r <= 8; r += 4) {
				ctx.beginPath();
				ctx.moveTo(-12 + Math.abs(r) * 0.3, 25 + r);
				ctx.lineTo(12 - Math.abs(r) * 0.3, 25 + r);
				ctx.stroke();
			}
			ctx.restore();
		}

		// Strings of lanterns overhead, scrolling a little slower than the path
		function drawLanterns(){
			var spacing = 340, sag = 46;
			eachProp(0.9, spacing, spacing, 17, function(x, r1){
				var x0 = x - r1 * spacing * 0.5;   // strings join end to end, so ignore the slot jitter
				ctx.strokeStyle = "rgba(40, 20, 30, 0.8)";
				ctx.lineWidth = 1.5;
				ctx.beginPath();
				ctx.moveTo(x0, 14);
				ctx.quadraticCurveTo(x0 + spacing / 2, 14 + sag * 2, x0 + spacing, 14);
				ctx.stroke();
				drawLantern(x0 + spacing / 2, 14 + sag, Math.round(x0 / spacing));
			});
		}

		// Cherry trees and grass on the front canvas, in front of the ninja, scrolling fastest of all
		function drawFront(shakeX, shakeY){
			fctx.clearRect(0, 0, W, H);
			fctx.save();
			fctx.translate(shakeX, shakeY);
			// Cherry trees rising from the bottom of the screen: the ninja walks behind them
			eachProp(1.3, W * 0.9, W * 0.45, 19, function(x, r1, r2){
				if (r2 < 0.5) drawTree(fctx, trees[Math.floor(r1 * trees.length)], x, H + 30, H * 0.8 / 450);
			});
			// Tall bamboo in front now and then (never on the first screen, which stays as it is)
			eachProp(1.3, W * 0.55, 200, 23, function(x, r1, r2){
				if (r2 < 0.35 && x + cameraX * 1.3 > W * 1.1) drawBamboo(fctx, x, H + 10, H / 420, r1);
			});
			var g = Math.max(0.6, scale);
			eachProp(1.4, 60, 60, 13, function(x, r1, r2){
				if (r2 > 0.6) return;
				var h = (20 + r1 * 36) * g;
				fctx.fillStyle = r2 < 0.25 ? "#6b8f4e" : "#577a3e";
				for (var b = -2; b <= 2; b++) {
					fctx.beginPath();
					fctx.moveTo(x + (b * 4 - 3) * g, H + 4);
					fctx.quadraticCurveTo(x + b * 6 * g, H - h * 0.5, x + b * 10 * g, H - h * (1 - Math.abs(b) * 0.2));
					fctx.lineTo(x + (b * 4 + 3) * g, H + 4);
					fctx.closePath();
					fctx.fill();
				}
			});
			fctx.restore();
		}

		function frame(now){
			var dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
			last = now;
			time += dt;
			var camDelta = cameraX - lastCameraX;
			lastCameraX = cameraX;
			var s = H / 900;

			ctx.save();
			var shakeX = 0, shakeY = 0;
			if (shake > 0.2) {
				shakeX = (Math.random() - 0.5) * shake;
				shakeY = (Math.random() - 0.5) * shake;
				ctx.translate(shakeX, shakeY);
				shake *= Math.pow(0.02, dt);
			}

			// Sky, stars and sun don't scroll: they're too far away

			for (var i = 0; i < stars.length; i++) {

			var glow = ctx.createRadialGradient(sunX, sunY, R * 0.8, sunX, sunY, R * 2.8);

			// Ground shadow under the ninja while it's in the air (shrinks as it rises)
			if (shadowY !== null) {
				var lift = shadowY - (ninja.offsetTop + 48);
				var shrink = Math.max(0.5, 1 - lift / 160);
				ctx.fillStyle = "rgba(26, 0, 102, " + (0.35 * (parseFloat(ninja.style.opacity) || 1)) + ")";
				ctx.beginPath();
				ctx.ellipse(ninja.offsetLeft + 23, shadowY, 16 * shrink, 4 * shrink, 0, 0, Math.PI * 2);
				ctx.fill();

			// Falling petals drift with the world as it scrolls
			for (var p = 0; p < petals.length; p++) {
				var pt = petals[p];
				pt.x += (pt.vx + Math.sin(time * 1.3 + pt.sway) * 25) * dt - camDelta * 0.9;
				pt.y += pt.vy * dt;
				pt.rot += pt.vr * dt;
				if (pt.y > H + 20 || pt.x < -40 || pt.x > W + 40) petals[p] = pt = newPetal(Math.random, false);
				ctx.save();
				ctx.translate(pt.x, pt.y);
				ctx.rotate(pt.rot);
				ctx.fillStyle = "#ffb7cf";
				ctx.beginPath();
				ctx.ellipse(0, 0, pt.size, pt.size * 0.55, 0, 0, Math.PI * 2);

			drawLanterns();

			for (var k = sparks.length - 1; k >= 0; k--) {

				sp.life -= dt;

				sp.x += sp.vx * dt - camDelta;
				sp.y += sp.vy * dt;

				ctx.fillStyle = sp.color;
				ctx.save();

				ctx.rotate(Math.atan2(sp.vy, sp.vx));

				ctx.ellipse(0, 0, sp.size * sp.stretch, sp.size * (sp.stretch > 1 ? 0.6 : 1), 0, 0, Math.PI * 2);

				ctx.restore();
			}

			ctx.restore();

			if (flash > 0) {
				ctx.fillStyle = "rgba(255, 40, 40, " + (flash * 0.45) + ")";
				ctx.fillRect(0, 0, W, H);

		window.addEventListener("resize", resize);

		return {

	// NES-style chiptune loop built with the Web Audio API (no audio files needed).
	// Channels mimic the old Nintendo sound chip: two pulse waves (lead + echo),
	// a triangle bass and a noise drum kit. The melody uses the Japanese "in" scale
	// (D, Eb, G, A, Bb) in two 4-bar sections.
	var music = (function(){
		var BPM = 150;
		var STEP = 60 / BPM / 4;
		var VOLUME = 0.12;
		var _ = null;
		var melody = [
			// Section A
			74,_,70,69, 67,_,69,70, 74,_,75,74, 70,_,69,_,
			67,_,69,70, 69,67,63,_, 62,_,63,67, 69,_,_,_,
			74,_,70,69, 67,_,69,70, 75,_,79,75, 74,_,70,_,
			69,70,69,67, 63,_,67,_, 62,_,_,_, 62,_,_,_,
			// Section B
			81,_,79,_, 75,_,74,_, 79,_,75,74, 70,_,_,_,
			74,75,74,70, 69,_,67,_, 69,70,74,75, 79,_,_,_,
			81,_,82,81, 79,_,75,_, 74,75,79,_, 75,74,70,_,
			69,_,70,_, 74,_,69,_, 62,_,_,_, 62,63,67,69

		// Pulse wave with the given duty cycle, like the NES square channels
		function pulseWave(duty){

			return ctx.createPeriodicWave(real, imag);
		}

		function init(){
			var AC = window.AudioContext || window.webkitAudioContext;
			if (!AC) return false;
			ctx = new AC();
			master = ctx.createGain();
			master.gain.value = VOLUME;
			master.connect(ctx.destination);
			noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
			var data = noiseBuf.getChannelData(0);
			for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
			lead = pulseWave(0.25);
			echo = pulseWave(0.125);
			return true;
		}

		function tone(wave, freq, t, dur, vol, cutoff){
			var o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
			if (typeof wave === "string") o.type = wave;
			else o.setPeriodicWave(wave);
			o.frequency.value = freq;
			f.type = "lowpass";
			f.frequency.value = cutoff;
			g.gain.setValueAtTime(0.0001, t);
			g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
			g.gain.setValueAtTime(vol, t + dur * 0.6);
			g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
			o.connect(f); f.connect(g); g.connect(master);
			// Long notes get that wobbly Simon's Quest vibrato
			if (dur > STEP * 2.5) {
				var lfo = ctx.createOscillator(), depth = ctx.createGain();
				lfo.frequency.value = 6;
				depth.gain.setValueAtTime(0, t);
				depth.gain.linearRampToValueAtTime(freq * 0.015, t + 0.18);
				lfo.connect(depth); depth.connect(o.frequency);
				lfo.start(t);
				lfo.stop(t + dur + 0.02);
			}
			o.start(t);
			o.stop(t + dur + 0.02);
		}

		// How long a melody note rings: until the next note, up to one beat
		function noteLength(s){
			var len = 1;
			while (len < 4 && melody[(s + len) % melody.length] === null) len++;
			return len * STEP * 0.92;
		}

		function noise(t, dur, vol, type, freq){
			var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
			src.buffer = noiseBuf;
			f.type = type;
			f.frequency.value = freq;
			g.gain.setValueAtTime(vol, t);
			g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
			src.connect(f); f.connect(g); g.connect(master);
			src.start(t);
			src.stop(t + dur + 0.02);
		}

		function kick(t){
			var o = ctx.createOscillator(), g = ctx.createGain();
			o.frequency.setValueAtTime(150, t);
			o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
			g.gain.setValueAtTime(0.8, t);
			g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
			o.connect(g); g.connect(master);
			o.start(t);
			o.stop(t + 0.17);
		}

		function playStep(s, t){
			var len = melody.length;
			var bar = Math.floor(s / 16) % 8, i = s % 16, note = melody[s % len];
			var sectionB = bar >= 4;

			// Pulse 1: lead melody
			if (note !== null) tone(lead, mtof(note), t, noteLength(s % len), 0.3, 6000);
			// Pulse 2: the classic NES "echo" of the melody, a dotted eighth behind
			var echoNote = melody[(s - 3 + len) % len];
			if (echoNote !== null && s >= 3) tone(echo, mtof(echoNote), t, STEP * 1.4, 0.1, 4000);
			// Triangle: bouncing octave bass on eighth notes
			if (i % 2 === 0) tone("triangle", mtof(bassRoots[bar] + (i % 4 === 2 ? 12 : 0)), t, STEP * 1.7, 0.75, 8000);
			// Noise channel drums
			if (i === 0 || i === 8 || (sectionB && i === 10)) kick(t);
			if (i === 4 || i === 12) noise(t, 0.13, 0.55, "bandpass", 1800);
			if (i % 2 === 0) noise(t, 0.03, 0.16, "highpass", 7000);
			if (sectionB && i === 15) noise(t, 0.06, 0.35, "bandpass", 2600);
		}

		function schedule(){
			if (!on) return;
			if (nextTime < ctx.currentTime - 0.2) nextTime = ctx.currentTime + 0.05;
			while (nextTime < ctx.currentTime + 0.12) {
				playStep(step, nextTime);
				nextTime += STEP;
				step++;
			}
		}

		function start(){
			if (!ctx) return;
			if (ctx.state === "suspended") ctx.resume();
			if (on && !started) {
				started = true;
				nextTime = ctx.currentTime + 0.05;

			if (!ctx) return;
			if (document.hidden) ctx.suspend();

		});

			start: start,
			context: function(){ return ctx; },
			toggle: function(){
				on = !on;
				if (ctx) {
					master.gain.cancelScheduledValues(ctx.currentTime);

			duck: function(seconds, level){
				if (!ctx || !on) return;
				var g = master.gain, now = ctx.currentTime;

				g.linearRampToValueAtTime(VOLUME * level, now + 0.03);
				g.setValueAtTime(VOLUME * level, now + seconds);
				g.linearRampToValueAtTime(VOLUME, now + seconds + 0.25);
			}
		};
	})();

	// Sound effects: the original voice recordings, decoded up front with the Web Audio API
	// so they fire the instant a key is pressed. Falls back to <audio> if decoding isn't possible.
	var sfx = (function(){
		var ctx = music.context();
		var buffers = {}, offsets = {}, fallback = {}, playing = {};

		// Skip the quiet lead-in at the start of a recording: find the first 10ms window
		// with real sound, then back up 40ms so the start of the voice isn't clipped
		function firstSound(buf){
			var data = buf.getChannelData(0), win = Math.floor(buf.sampleRate * 0.01);
			for (var i = 0; i + win <= data.length; i += win) {
				var sum = 0;
				for (var j = i; j < i + win; j++) sum += data[j] * data[j];
				if (Math.sqrt(sum / win) > 0.03) return Math.max(0, i / buf.sampleRate - 0.04);
			}
			return 0;
		}

		function load(name, url){
			fallback[name] = new Audio(url);
			if (!ctx || !window.fetch) return;
			fetch(url)
				.then(function(r){ if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
				.then(function(data){ return new Promise(function(res, rej){ ctx.decodeAudioData(data, res, rej); }); })
				.then(function(buf){ offsets[name] = firstSound(buf); buffers[name] = buf; })
				.catch(function(){});
		}

		function play(name, duckSeconds, duckLevel){
			music.duck(duckSeconds, duckLevel);
			if (ctx && buffers[name]) {
				if (ctx.state === "suspended") ctx.resume();
				// Restart the clip rather than stacking copies of it
				if (playing[name]) { try { playing[name].stop(); } catch (e) {} }
				var src = ctx.createBufferSource();
				src.buffer = buffers[name];
				src.connect(ctx.destination);
				src.start(0, offsets[name]);
				playing[name] = src;
			} else if (fallback[name]) {
				var a = fallback[name];
				a.currentTime = 0;
				var p = a.play();
				if (p && p.catch) p.catch(function(){});
			}
		}

		// Quick NES-style pitch sweep: jump "boing", star pickup chime, throw whoosh
		function blip(from, to, duration){
			if (!ctx) return;
			if (ctx.state === "suspended") ctx.resume();
			var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
			o.type = "square";
			o.frequency.setValueAtTime(from, t);
			o.frequency.exponentialRampToValueAtTime(to, t + duration * 0.8);
			g.gain.setValueAtTime(0.08, t);
			g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
			o.connect(g); g.connect(ctx.destination);
			o.start(t);
			o.stop(t + duration + 0.02);
		}

		function jump(){
			blip(220, 880, 0.2);
		}

		return { load: load, play: play, jump: jump, blip: blip };
	})();

	document.getElementById("musicBtn").addEventListener("click", function(){
		var isOn = music.toggle();
		this.innerHTML = "&#9835; Music: " + (isOn ? "On" : "Off");
		this.blur();
	});

	// The ninja's position along the scrolling world; its screen position comes from the camera
	var worldX = Math.round(window.innerWidth * 0.3);
	ninjaImg.style.top = scene.groundTop() + 'px';
	placeNinja();
	var requiredRestInterval = new Date().getTime();

	document.addEventListener("keypress",function(e){
		var restInterval = new Date().getTime();
		if(requiredRestInterval+1000<restInterval && (e.keyCode < 37 || e.keyCode > 40)){
			restInterval = new Date().getTime();
			requiredRestInterval = restInterval;
			attack();
		}
	  },false);

	document.onkeydown = move;




	function punch(){

		powImg.style.backgroundPosition = '-175px 0px';
		ninjaImg.style.backgroundPosition = '-40px 0px';

		powImg.style.top = (ninjaImg.offsetTop-10).toString() + 'px';
		powImg.style.zIndex=-1;
		  var result = window.getComputedStyle(ninjaImg).transform;
		  var offset = 15;
		  if(result[7] == "-")
		  {
			offset = offset * -3;
		  }
		  powImg.style.left = (ninjaImg.offsetLeft + offset).toString() + 'px';
		var powBox = powImg.getBoundingClientRect();
		scene.hit(powBox.left + powBox.width / 2, powBox.top + powBox.height / 2);

		audioPunch.play();
	}

	function stepLeft(){
	  ninjaImg.style.backgroundPosition = '0px 0px';
	}
	function stepRight(){
		ninjaImg.style.backgroundPosition = '-126px 0px';
	}

	function standNeutral(){
		ninjaImg.style.backgroundPosition = '-85px 0px';
		powImg.style.backgroundPosition = '-230px 0px';
	}



	function attack() {
		// Counts as a move, so the ninja can't jump or kick mid-punch
		if (!startMove()) return;
		setTimeout(punch,100);
		setTimeout(finishMove,600);
	}

	// ---- Special moves: jumps, kicks and mid-air attacks ----
	// The poses live in Resources/Images/Ninja_Moves.png: 64x50 cells, all facing right.
	// While a move plays, the regular ninja image is hidden and #moves shows the pose.
	var movesImg = document.getElementById("moves");
	var POSES = { crouch: 0, tuck: 1, sideChamber: 2, sideKick: 3, roundChamber: 4, roundKick: 5, flyingKick: 6, airRoundKick: 7, airPunch: 8 };
	var POSE_W = 64, NINJA_W = 46;
	var moveBusy = false, airborne = false, airAttacked = false;
	var MOVE_KEYS = { " ": jump, "k": sideKick, "r": roundhouse, "f": flyingKick, "t": throwStar };

	// One attack per jump; x, y is where the hit lands on the pose (facing right)
	var AIR_ATTACKS = {
		kick: { pose: "flyingKick", x: 44, y: 40, kick: true },
		roundhouse: { pose: "airRoundKick", x: 39, y: 10, kick: true },
		punch: { pose: "airPunch", x: 40, y: 21 }
	};

	function facingLeft(){
		return window.getComputedStyle(ninjaImg).transform.charAt(7) == "-";
	}

	function showPose(name){
		movesImg.style.backgroundPosition = (-POSES[name] * POSE_W) + "px 0px";
		movesImg.style.display = "block";
		ninjaImg.style.visibility = "hidden";
		placePose();
	}

	// Keep the pose lined up with the (hidden) ninja, mirrored when facing left
	function placePose(){
		var left = facingLeft();
		movesImg.style.left = (ninjaImg.offsetLeft - (left ? POSE_W - NINJA_W : 0)) + "px";
		movesImg.style.top = ninjaImg.offsetTop + "px";
		movesImg.style.transform = left ? "scaleX(-1)" : "none";
	}

	// Moves (including punches) don't overlap: a new one can't start until this one finishes
	function startMove(){
		if (moveBusy) return false;
		moveBusy = true;
		(function follow(){
			if (!moveBusy) return;
			placePose();
			requestAnimationFrame(follow);
		})();
		return true;
	}

	function finishMove(){
		moveBusy = false;
		movesImg.style.display = "none";
		ninjaImg.style.visibility = "visible";
		standNeutral();
	}

	// Land a hit at a spot on the current pose (x, y in pose-cell pixels, facing right)
	function strike(x, y, isKick){
		placePose();
		var box = movesImg.getBoundingClientRect();
		var hitX = facingLeft() ? box.right - x : box.left + x;
		var hitY = box.top + y;
		powImg.style.backgroundPosition = '-175px 0px';
		powImg.style.zIndex = -1;
		var powBox = powImg.getBoundingClientRect();
		powImg.style.left = ((parseFloat(powImg.style.left) || 0) + hitX - powBox.width / 2 - powBox.left) + 'px';
		powImg.style.top = ((parseFloat(powImg.style.top) || 0) + hitY - powBox.height / 2 - powBox.top) + 'px';
		scene.hit(hitX, hitY);
		if (isKick) scene.kick(hitX, hitY);
		audioPunch.play();
	}

	function hidePow(){
		powImg.style.backgroundPosition = '-230px 0px';
	}

	// Runs [delay in ms, step] pairs one after another
	function sequence(steps){
		var i = 0;
		(function next(){
			if (i >= steps.length) return;
			var s = steps[i++];
			setTimeout(function(){ s[1](); next(); }, s[0]);
		})();
	}

	// Carries the ninja up and back down, optionally travelling forward
	function leap(duration, height, forward, kickAt, onLand){
		var groundTop = ninjaImg.offsetTop;
		var dir = facingLeft() ? -1 : 1;
		var start = performance.now(), travelled = 0, kicked = false;
		airborne = true;
		// A flying kick reserves the jump's one attack so another key can't use it up
		airAttacked = kickAt !== null;
		scene.setShadow(groundTop + 48);
		(function tick(now){
			// Frame timestamps can be a few ms older than `start`, so keep t from going negative
			var t = Math.max(0, Math.min(1, (now - start) / duration));
			ninjaImg.style.top = Math.round(groundTop - height * 4 * t * (1 - t)) + "px";
			var travel = Math.round(dir * forward * t);
			moveNinjaBy(travel - travelled);
			travelled = travel;
			if (kickAt !== null && !kicked && t >= kickAt) {
				kicked = true;
				performAirAttack("kick");
			}
			if (t < 1) {
				requestAnimationFrame(tick);
			} else {
				ninjaImg.style.top = groundTop + "px";
				airborne = false;
				scene.setShadow(null);
				onLand();
			}
		})(start);
	}

	function airAttack(kind){
		if (airAttacked) return;
		airAttacked = true;
		performAirAttack(kind);
	}

	function performAirAttack(kind){
		var attack = AIR_ATTACKS[kind];
		showPose(attack.pose);
		strike(attack.x, attack.y, attack.kick);
	}

	function land(){
		hidePow();
		showPose("crouch");
		setTimeout(finishMove, 100);
	}

	// Turns to face Left or Right if one is held; returns -1, 0 or 1
	function faceHeldDirection(){
		var dx = (heldArrows[39] ? 1 : 0) - (heldArrows[37] ? 1 : 0);
		if (dx) ninjaImg.style.transform = dx < 0 ? "scaleX(-1)" : "scaleX(1)";
		return dx;
	}

	// Straight up, or sideways when Left/Right is held (further when running)
	function jump(){
		if (!startMove()) return;
		showPose("crouch");
		setTimeout(function(){
			var dx = faceHeldDirection();
			showPose("tuck");
			sfx.jump();
			leap(dx ? 650 : 560, 80, dx ? (running ? 170 : 110) : 0, null, land);
		}, 70);
	}

	function flyingKick(){
		if (airborne) { airAttack("kick"); return; }
		if (!startMove()) return;
		showPose("crouch");
		setTimeout(function(){
			faceHeldDirection();
			showPose("tuck");
			sfx.jump();
			leap(700, 70, running ? 170 : 110, 0.2, land);
		}, 80);
	}

	function sideKick(){
		if (airborne) { airAttack("kick"); return; }
		if (!startMove()) return;
		sequence([
			[0, function(){ showPose("sideChamber"); }],
			[90, function(){ showPose("sideKick"); strike(42, 29, true); }],
			[280, function(){ hidePow(); showPose("sideChamber"); }],
			[90, finishMove]
		]);
	}

	function roundhouse(){
		if (airborne) { airAttack("roundhouse"); return; }
		if (!startMove()) return;
		sequence([
			[0, function(){ showPose("roundChamber"); }],
			[110, function(){ showPose("roundKick"); strike(39, 12, true); }],
			[300, function(){ hidePow(); showPose("roundChamber"); }],
			[100, finishMove]
		]);
	}

	// ---- Ninja stars: kick the gate to knock some loose, walk over them to pick up, T throws ----
	var starCount = 0;
	var starCountEl = document.getElementById("starCount");

	function updateStarCount(){
		starCountEl.hidden = starCount === 0;
		starCountEl.textContent = "\u2726 \u00d7 " + starCount;
	}

	scene.onCollect(function(){
		starCount++;
		updateStarCount();
		sfx.blip(880, 1760, 0.12);
	});

	function throwStar(){
		if (airborne || starCount === 0 || !startMove()) return;
		starCount--;
		updateStarCount();
		ninjaImg.style.backgroundPosition = '-40px 0px';   // the punch frame doubles as a throw
		var dir = facingLeft() ? -1 : 1;
		var box = ninjaImg.getBoundingClientRect();
		scene.throwStar(dir > 0 ? box.right : box.left, box.top + 21, dir);
		sfx.blip(1400, 300, 0.15);
		setTimeout(finishMove, 250);
	}

	// ---- Stealth mode: hold S to fade out; let go and the ninja slowly fades back in ----
	// Becoming stealthy takes full concentration, so nothing else works while S is held.
	var STEALTH_MIN_OPACITY = 0.1, STEALTH_FADE_OUT_SECONDS = 1.5, STEALTH_FADE_IN_SECONDS = 4;
	var stealthHeld = false, ninjaOpacity = 1, lastStealthTick = performance.now();

	function beginStealth(){
		if (moveBusy || airborne || stealthHeld) return;
		stealthHeld = true;
		scene.puff(ninjaImg.offsetLeft + NINJA_W / 2, ninjaImg.offsetTop + 30);
	}

	document.addEventListener("keyup", function(e){
		if ((e.key || "").toLowerCase() === "s") stealthHeld = false;
	});
	window.addEventListener("blur", function(){ stealthHeld = false; });

	(function stealthTick(now){
		var dt = Math.min(0.05, (now - lastStealthTick) / 1000);
		lastStealthTick = now;
		var range = 1 - STEALTH_MIN_OPACITY;
		if (stealthHeld) ninjaOpacity = Math.max(STEALTH_MIN_OPACITY, ninjaOpacity - dt * range / STEALTH_FADE_OUT_SECONDS);
		else ninjaOpacity = Math.min(1, ninjaOpacity + dt * range / STEALTH_FADE_IN_SECONDS);
		ninjaImg.style.opacity = ninjaOpacity;
		movesImg.style.opacity = ninjaOpacity;
		requestAnimationFrame(stealthTick);
	})(lastStealthTick);

	// Swallow a key press so it doesn't also turn into a punch (browser shortcuts still work)
	function blockKey(e){
		if (!e.ctrlKey && !e.metaKey && !e.altKey) e.preventDefault();
	}

	// ---- Walking and running ----
	// Hold the arrow keys to walk quietly; hold Shift too to run, with loud chip-bag footsteps.
	var WALK_SPEED = 60, RUN_SPEED = 180;   // pixels per second
	var WALK_STRIDE = 6, RUN_STRIDE = 18;   // pixels travelled per footstep
	var heldArrows = {}, running = false;
	var strideDistance = 0, rightFootNext = true, carryX = 0, lastWalkTick = performance.now();

	// Moves the ninja along the world, which starts at x = 0 (the left edge of the first screen)
	function moveNinjaBy(dx){
		worldX = Math.max(0, worldX + dx);
		placeNinja();
	}

	function placeNinja(){
		var cameraX = scene.follow(worldX + 23);
		ninjaImg.style.left = Math.round(worldX - cameraX) + 'px';
	}

	window.addEventListener("resize", function(){
		if (!airborne) ninjaImg.style.top = scene.groundTop() + 'px';
		placeNinja();
	});

	document.addEventListener("keyup", function(e){
		running = e.shiftKey;
		delete heldArrows[e.keyCode];
	});
	window.addEventListener("blur", function(){
		heldArrows = {};
		running = false;
	});

	function footstep(){
		if (rightFootNext) {
			stepRight();
			if (running) audioStepRight.play();
		} else {
			stepLeft();
			if (running) audioStepLeft.play();
		}
		rightFootNext = !rightFootNext;
	}

	(function walkTick(now){
		var dt = Math.max(0, Math.min(0.05, (now - lastWalkTick) / 1000));
		lastWalkTick = now;
		// Side-scroller: only left and right. Nothing works while becoming stealthy,
		// and jumps pick their direction at takeoff.
		var dx = (heldArrows[39] ? 1 : 0) - (heldArrows[37] ? 1 : 0);
		if (stealthHeld || airborne || !dx) {
			strideDistance = RUN_STRIDE;   // so the next footstep lands right away
			requestAnimationFrame(walkTick);
			return;
		}
		var distance = (running ? RUN_SPEED : WALK_SPEED) * dt;
		// Keep fractions of a pixel between frames so slow walking still moves on fast screens
		carryX += dx * distance;
		var moveX = Math.trunc(carryX);
		carryX -= moveX;
		if (moveX) moveNinjaBy(moveX);
		ninjaImg.style.transform = dx < 0 ? "scaleX(-1)" : "scaleX(1)";
		strideDistance += distance;
		if (strideDistance >= (running ? RUN_STRIDE : WALK_STRIDE)) {
			strideDistance = 0;
			footstep();
		}
		requestAnimationFrame(walkTick);
	})(lastWalkTick);

	function move(e){
		var key = (e.key || "").toLowerCase();
		running = e.shiftKey;
		// Arrow keys are handled by walkTick while they're held down
		if (e.keyCode >= 37 && e.keyCode <= 40) {
			blockKey(e);
			heldArrows[e.keyCode] = true;
			return;
		}
		if (key === "s") {
			blockKey(e);
			if (!e.repeat) beginStealth();
			return;
		}
		if (stealthHeld) {
			blockKey(e);
			return;
		}
		if (MOVE_KEYS[key]) {
			// Stops the key from also counting as a punch (and Space from scrolling)
			blockKey(e);
			if (!e.repeat) MOVE_KEYS[key]();
			return;
		}
		// In the air, any other key throws a punch (one attack per jump)
		if (airborne) {
			blockKey(e);
			if (!e.repeat && key.length === 1) airAttack("punch");
			return;
		}
		// No punching in the middle of a kick
		if (moveBusy) blockKey(e);
	}
</script>
</html>
