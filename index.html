<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ninja Attack!</title>
<style>
html, body {
  height: 100%;
  overflow: hidden;
}

#scene {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -2;
}

#ninja {
  width: 46px;
  height: 50px;
  background: url(Resources/Images/Ninja_Sprites.gif) -126px 0;
}

#pow {
  width: 60px;
  height: 50px;
  background: url(Resources/Images/Ninja_Sprites.gif) -230px 0px;
}
.imgContainer{
    float:left;
}

#musicBtn {
  position: fixed;
  top: 12px;
  right: 12px;
  padding: 6px 14px;
  font: 14px/1.2 "Segoe UI", system-ui, sans-serif;
  color: #ffe8c2;
  background: rgba(43, 27, 74, 0.75);
  border: 1px solid rgba(255, 220, 180, 0.5);
  border-radius: 999px;
  cursor: pointer;
}
#musicBtn:hover {
  background: rgba(43, 27, 74, 0.9);
}

#hint {
  position: fixed;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font: 13px/1.2 "Segoe UI", system-ui, sans-serif;
  color: rgba(70, 30, 45, 0.75);
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="imgContainer">
	<img id="ninja" src="Resources/Images/img_trans.gif" width="1" height="1"><br><br>
</div>
<div class="imgContainer">
	<img id="pow" src="Resources/Images/img_trans.gif" width="1" height="1"><br><br>
</div>
<button id="musicBtn" type="button">&#9835; Music: On</button>
<div id="hint">Arrow keys to move &middot; any other key to strike &middot; music starts with your first key</div>
</body>

<script>
	// Sunset dojo backdrop: sky, sun, Mt. Fuji, pagoda, torii gate, cherry tree,
	// falling petals and swinging lanterns. Layers shift slightly with the ninja (parallax).
	var scene = (function(){
		var canvas = document.getElementById("scene");
		var ctx = canvas.getContext("2d");
		var ninja = document.getElementById("ninja");
		var W, H, horizon, scale;
		var stars = [], clouds = [], farRidge = [], midRidge = [];
		var branches = [], blossoms = [], petals = [], sparks = [];
		var flash = 0, shake = 0, parallax = 0, time = 0, last = performance.now();

		function seeded(seed){
			return function(){
				seed = (seed * 16807) % 2147483647;
				return (seed - 1) / 2147483646;
			};
		}

		function ridge(rnd, base, amp, n){
			var pts = [];
			for (var i = 0; i <= n; i++) {
				pts.push({ x: -150 + (W + 300) * i / n, y: base - rnd() * amp });
			}
			return pts;
		}

		function growBranch(rnd, x, y, angle, len, width, depth){
			var x2 = x + Math.cos(angle) * len;
			var y2 = y + Math.sin(angle) * len;
			branches.push({ x1: x, y1: y, x2: x2, y2: y2, w: width });
			if (depth === 0) {
				blossoms.push({ x: x2, y: y2, r: (12 + rnd() * 10) * scale });
				return;
			}
			if (depth < 3) {
				blossoms.push({ x: (x + x2) / 2, y: (y + y2) / 2, r: (9 + rnd() * 7) * scale });
			}
			growBranch(rnd, x2, y2, angle - 0.3 - rnd() * 0.3, len * 0.74, width * 0.66, depth - 1);
			growBranch(rnd, x2, y2, angle + 0.3 + rnd() * 0.3, len * 0.7, width * 0.66, depth - 1);
		}

		function newPetal(rnd, anywhere){
			return {
				x: anywhere ? rnd() * W : W * (0.55 + rnd() * 0.55),
				y: anywhere ? rnd() * H : -20 + rnd() * H * 0.4,
				vx: -30 - rnd() * 40,
				vy: 25 + rnd() * 35,
				rot: rnd() * 6.28,
				vr: -2 + rnd() * 4,
				size: 3 + rnd() * 3,
				sway: rnd() * 6.28
			};
		}

		function resize(){
			var dpr = window.devicePixelRatio || 1;
			W = window.innerWidth;
			H = window.innerHeight;
			canvas.width = Math.round(W * dpr);
			canvas.height = Math.round(H * dpr);
			canvas.style.width = W + "px";
			canvas.style.height = H + "px";
			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			horizon = H * 0.68;
			scale = Math.min(W, H) / 800;

			var rnd = seeded(7);
			stars = [];
			for (var i = 0; i < 90; i++) {
				stars.push({ x: rnd() * W, y: rnd() * horizon * 0.5, s: 0.4 + rnd() * 1.3, t: rnd() * 6.28 });
			}
			clouds = [];
			for (var c = 0; c < 6; c++) {
				clouds.push({ x: rnd() * W, y: H * 0.14 + rnd() * (horizon - H * 0.38), w: 120 + rnd() * 220, h: 6 + rnd() * 8, v: 4 + rnd() * 10 });
			}
			farRidge = ridge(rnd, horizon - H * 0.07, H * 0.09, 16);
			midRidge = ridge(rnd, horizon - H * 0.015, H * 0.05, 24);

			branches = [];
			blossoms = [];
			growBranch(rnd, W * 0.95, H + 10, -Math.PI / 2 - 0.35, H * 0.22, 26 * scale, 6);

			if (petals.length === 0) {
				for (var p = 0; p < 50; p++) petals.push(newPetal(Math.random, true));
			}
		}

		function drawRidge(pts, color, dx){
			ctx.fillStyle = color;
			ctx.beginPath();
			ctx.moveTo(pts[0].x + dx, H);
			ctx.lineTo(pts[0].x + dx, pts[0].y);
			for (var i = 1; i < pts.length; i++) {
				var mx = (pts[i - 1].x + pts[i].x) / 2 + dx;
				var my = (pts[i - 1].y + pts[i].y) / 2;
				ctx.quadraticCurveTo(pts[i - 1].x + dx, pts[i - 1].y, mx, my);
			}
			ctx.lineTo(pts[pts.length - 1].x + dx, H);
			ctx.closePath();
			ctx.fill();
		}

		function drawFuji(dx){
			var cx = W * 0.64 + dx;
			var h = H * 0.36;
			var bw = Math.min(W * 0.34, h * 1.9);
			var peak = horizon - h;
			ctx.save();
			ctx.beginPath();
			ctx.moveTo(cx - bw, horizon);
			ctx.quadraticCurveTo(cx - bw * 0.35, horizon - h * 0.55, cx - bw * 0.1, peak);
			ctx.lineTo(cx + bw * 0.1, peak);
			ctx.quadraticCurveTo(cx + bw * 0.35, horizon - h * 0.55, cx + bw, horizon);
			ctx.closePath();
			ctx.fillStyle = "#9a5a86";
			ctx.fill();
			ctx.clip();
			// Snow cap with a jagged lower edge
			ctx.fillStyle = "#fbe7ef";
			ctx.beginPath();
			ctx.moveTo(cx - bw, peak - 10);
			ctx.lineTo(cx + bw, peak - 10);
			var capY = peak + h * 0.24;
			for (var i = 10; i >= 0; i--) {
				var x = cx - bw * 0.5 + bw * i / 10;
				ctx.lineTo(x, capY + (i % 2 ? h * 0.07 : 0));
			}
			ctx.closePath();
			ctx.fill();
			ctx.restore();
		}

		function drawPagoda(x, baseY, s, color){
			ctx.fillStyle = color;
			var y = baseY;
			for (var k = 0; k < 5; k++) {
				var tw = (64 - k * 9) * s;
				var bodyH = 13 * s;
				var roofH = 7 * s;
				ctx.fillRect(x - tw * 0.3, y - bodyH, tw * 0.6, bodyH);
				ctx.beginPath();
				ctx.moveTo(x - tw / 2 - 5 * s, y - bodyH - 1 * s);
				ctx.quadraticCurveTo(x - tw * 0.32, y - bodyH, x - tw * 0.24, y - bodyH - roofH);
				ctx.lineTo(x + tw * 0.24, y - bodyH - roofH);
				ctx.quadraticCurveTo(x + tw * 0.32, y - bodyH, x + tw / 2 + 5 * s, y - bodyH - 1 * s);
				ctx.closePath();
				ctx.fill();
				y -= bodyH + roofH;
			}
			ctx.fillRect(x - 1.5 * s, y - 22 * s, 3 * s, 22 * s);
		}

		function drawTorii(x, baseY, h){
			ctx.fillStyle = "rgba(80, 30, 40, 0.18)";
			ctx.beginPath();
			ctx.ellipse(x, baseY + 2, h * 0.55, h * 0.05, 0, 0, Math.PI * 2);
			ctx.fill();

			var post = h * 0.07;
			ctx.fillStyle = "#c7362f";
			ctx.fillRect(x - h * 0.36 - post / 2, baseY - h * 0.88, post, h * 0.88);
			ctx.fillRect(x + h * 0.36 - post / 2, baseY - h * 0.88, post, h * 0.88);
			ctx.fillRect(x - h * 0.5, baseY - h * 0.72, h, h * 0.05);
			ctx.fillRect(x - h * 0.52, baseY - h * 0.87, h * 1.04, h * 0.055);
			ctx.fillRect(x - h * 0.025, baseY - h * 0.82, h * 0.05, h * 0.1);

			ctx.fillStyle = "#2a1a22";
			ctx.beginPath();
			ctx.moveTo(x - h * 0.62, baseY - h * 0.98);
			ctx.quadraticCurveTo(x, baseY - h * 0.88, x + h * 0.62, baseY - h * 0.98);
			ctx.lineTo(x + h * 0.56, baseY - h * 0.9);
			ctx.quadraticCurveTo(x, baseY - h * 0.82, x - h * 0.56, baseY - h * 0.9);
			ctx.closePath();
			ctx.fill();
		}

		function drawTree(dx){
			ctx.lineCap = "round";
			ctx.strokeStyle = "#3d2230";
			for (var i = 0; i < branches.length; i++) {
				var b = branches[i];
				ctx.lineWidth = Math.max(1, b.w);
				ctx.beginPath();
				ctx.moveTo(b.x1 + dx, b.y1);
				ctx.lineTo(b.x2 + dx, b.y2);
				ctx.stroke();
			}
			var pinks = ["#f48fb1", "#f7a8c4", "#ffd1e0"];
			for (var j = 0; j < blossoms.length; j++) {
				var bl = blossoms[j];
				for (var k = 0; k < 3; k++) {
					ctx.fillStyle = pinks[k];
					ctx.beginPath();
					ctx.arc(bl.x + dx + (k - 1) * bl.r * 0.45, bl.y - k * bl.r * 0.3, bl.r * (1 - k * 0.22), 0, Math.PI * 2);
					ctx.fill();
				}
			}
		}

		function drawLanterns(){
			var p0 = { x: -10, y: 16 }, p1 = { x: W / 2, y: 70 }, p2 = { x: W + 10, y: 16 };
			ctx.strokeStyle = "rgba(40, 20, 30, 0.8)";
			ctx.lineWidth = 1.5;
			ctx.beginPath();
			ctx.moveTo(p0.x, p0.y);
			ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
			ctx.stroke();

			var spots = [0.12, 0.3, 0.5, 0.7];
			for (var i = 0; i < spots.length; i++) {
				var t = spots[i];
				var x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
				var y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
				ctx.save();
				ctx.translate(x, y);
				ctx.rotate(Math.sin(time * 1.4 + i * 1.7) * 0.09);

				var glow = ctx.createRadialGradient(0, 24, 4, 0, 24, 44);
				glow.addColorStop(0, "rgba(255, 190, 90, 0.45)");
				glow.addColorStop(1, "rgba(255, 190, 90, 0)");
				ctx.fillStyle = glow;
				ctx.fillRect(-44, -20, 88, 88);

				ctx.strokeStyle = "rgba(40, 20, 30, 0.8)";
				ctx.beginPath();
				ctx.moveTo(0, 0);
				ctx.lineTo(0, 10);
				ctx.stroke();
				ctx.fillStyle = "#2a1a22";
				ctx.fillRect(-6, 9, 12, 4);
				ctx.fillRect(-6, 37, 12, 4);
				ctx.fillStyle = "#e2483c";
				ctx.beginPath();
				ctx.ellipse(0, 25, 13, 13, 0, 0, Math.PI * 2);
				ctx.fill();
				ctx.strokeStyle = "rgba(120, 20, 20, 0.5)";
				ctx.lineWidth = 1;
				for (var r = -8; r <= 8; r += 4) {
					ctx.beginPath();
					ctx.moveTo(-12 + Math.abs(r) * 0.3, 25 + r);
					ctx.lineTo(12 - Math.abs(r) * 0.3, 25 + r);
					ctx.stroke();
				}
				ctx.restore();
			}
		}

		function frame(now){
			var dt = Math.min(0.05, (now - last) / 1000);
			last = now;
			time += dt;

			var target = (ninja.offsetLeft + 23) / W - 0.5;
			parallax += (target - parallax) * Math.min(1, dt * 4);
			var px = -parallax;

			ctx.save();
			if (shake > 0.2) {
				ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
				shake *= Math.pow(0.02, dt);
			}

			// Sky
			var sky = ctx.createLinearGradient(0, 0, 0, horizon);
			sky.addColorStop(0, "#2b1b4a");
			sky.addColorStop(0.45, "#a8457a");
			sky.addColorStop(0.78, "#f5925a");
			sky.addColorStop(1, "#ffd98a");
			ctx.fillStyle = sky;
			ctx.fillRect(-20, -20, W + 40, horizon + 40);

			for (var i = 0; i < stars.length; i++) {
				var st = stars[i];
				var fade = 1 - st.y / (horizon * 0.5);
				ctx.globalAlpha = Math.max(0, fade * (0.55 + 0.45 * Math.sin(time * 2 + st.t)));
				ctx.fillStyle = "#fff6e0";
				ctx.fillRect(st.x, st.y, st.s, st.s);
			}
			ctx.globalAlpha = 1;

			// Sun
			var sunX = W * 0.28 + px * 12, sunY = horizon - H * 0.2, R = Math.min(W, H) * 0.11;
			var glow = ctx.createRadialGradient(sunX, sunY, R * 0.8, sunX, sunY, R * 2.8);
			glow.addColorStop(0, "rgba(255, 235, 170, 0.6)");
			glow.addColorStop(1, "rgba(255, 235, 170, 0)");
			ctx.fillStyle = glow;
			ctx.fillRect(sunX - R * 3, sunY - R * 3, R * 6, R * 6);
			ctx.fillStyle = "#fff0c8";
			ctx.beginPath();
			ctx.arc(sunX, sunY, R, 0, Math.PI * 2);
			ctx.fill();

			ctx.fillStyle = "rgba(255, 215, 195, 0.35)";
			for (var c = 0; c < clouds.length; c++) {
				var cl = clouds[c];
				cl.x += cl.v * dt;
				if (cl.x - cl.w > W) cl.x = -cl.w;
				ctx.beginPath();
				ctx.ellipse(cl.x + px * 18, cl.y, cl.w / 2, cl.h / 2, 0, 0, Math.PI * 2);
				ctx.fill();
			}

			// Mountains and pagoda
			drawRidge(farRidge, "#c9788f", px * 20);
			drawFuji(px * 24);
			drawPagoda(W * 0.84 + px * 40, horizon - H * 0.035, H / 1000, "#6e3f6b");
			drawRidge(midRidge, "#6e3f6b", px * 40);

			// Courtyard ground and stone path
			var ground = ctx.createLinearGradient(0, horizon, 0, H);
			ground.addColorStop(0, "#f0c890");
			ground.addColorStop(1, "#c98f5e");
			ctx.fillStyle = ground;
			ctx.fillRect(-20, horizon, W + 40, H - horizon + 20);
			ctx.fillStyle = "rgba(110, 50, 80, 0.18)";
			ctx.fillRect(-20, horizon, W + 40, 4);

			var gx = px * 70, cx = W * 0.5;
			ctx.fillStyle = "rgba(255, 245, 230, 0.3)";
			ctx.beginPath();
			ctx.moveTo(cx - W * 0.04 + gx * 0.4, horizon);
			ctx.lineTo(cx + W * 0.04 + gx * 0.4, horizon);
			ctx.lineTo(cx + W * 0.34 + gx, H);
			ctx.lineTo(cx - W * 0.34 + gx, H);
			ctx.closePath();
			ctx.fill();
			ctx.strokeStyle = "rgba(150, 90, 60, 0.25)";
			ctx.lineWidth = 1;
			for (var k = 1; k <= 9; k++) {
				var f = Math.pow(k / 9, 1.8);
				var ly = horizon + (H - horizon) * f;
				var half = W * 0.04 + (W * 0.3) * f;
				var shift = gx * (0.4 + 0.6 * f);
				ctx.beginPath();
				ctx.moveTo(cx - half + shift, ly);
				ctx.lineTo(cx + half + shift, ly);
				ctx.stroke();
			}

			drawTorii(W * 0.12 + px * 70, horizon + (H - horizon) * 0.4, H * 0.3);
			drawTree(px * 110);

			// Falling petals
			for (var p = 0; p < petals.length; p++) {
				var pt = petals[p];
				pt.x += (pt.vx + Math.sin(time * 1.3 + pt.sway) * 25) * dt;
				pt.y += pt.vy * dt;
				pt.rot += pt.vr * dt;
				if (pt.y > H + 20 || pt.x < -20) petals[p] = pt = newPetal(Math.random, false);
				ctx.save();
				ctx.translate(pt.x, pt.y);
				ctx.rotate(pt.rot);
				ctx.fillStyle = "#ffb7cf";
				ctx.beginPath();
				ctx.ellipse(0, 0, pt.size, pt.size * 0.55, 0, 0, Math.PI * 2);
				ctx.fill();
				ctx.restore();
			}

			drawLanterns();

			// Punch sparks
			for (var s = sparks.length - 1; s >= 0; s--) {
				var sp = sparks[s];
				sp.life -= dt;
				if (sp.life <= 0) { sparks.splice(s, 1); continue; }
				sp.vy += 420 * dt;
				sp.x += sp.vx * dt;
				sp.y += sp.vy * dt;
				ctx.globalAlpha = sp.life / sp.max;
				ctx.fillStyle = sp.color;
				ctx.save();
				ctx.translate(sp.x, sp.y);
				ctx.rotate(Math.atan2(sp.vy, sp.vx));
				ctx.beginPath();
				ctx.ellipse(0, 0, sp.size * 1.6, sp.size * 0.6, 0, 0, Math.PI * 2);
				ctx.fill();
				ctx.restore();
			}
			ctx.globalAlpha = 1;

			ctx.restore();

			if (flash > 0) {
				ctx.fillStyle = "rgba(255, 40, 40, " + (flash * 0.45) + ")";
				ctx.fillRect(0, 0, W, H);
				flash = Math.max(0, flash - dt * 2.5);
			}

			requestAnimationFrame(frame);
		}

		window.addEventListener("resize", resize);
		resize();
		requestAnimationFrame(frame);

		return {
			hit: function(x, y){
				flash = 1;
				shake = 8;
				var colors = ["#ffd23f", "#ff7aa8", "#ffffff"];
				for (var i = 0; i < 18; i++) {
					var a = Math.random() * Math.PI * 2;
					var v = 120 + Math.random() * 220;
					var life = 0.6 + Math.random() * 0.4;
					sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: life, max: life, size: 2.5 + Math.random() * 2.5, color: colors[i % 3] });
				}
			}
		};
	})();

	// NES-style chiptune loop built with the Web Audio API (no audio files needed).
	// Channels mimic the old Nintendo sound chip: two pulse waves (lead + echo),
	// a triangle bass and a noise drum kit. The melody uses the Japanese "in" scale
	// (D, Eb, G, A, Bb) in two 4-bar sections.
	var music = (function(){
		var BPM = 150;
		var STEP = 60 / BPM / 4;
		var VOLUME = 0.12;
		var _ = null;
		var melody = [
			// Section A
			74,_,70,69, 67,_,69,70, 74,_,75,74, 70,_,69,_,
			67,_,69,70, 69,67,63,_, 62,_,63,67, 69,_,_,_,
			74,_,70,69, 67,_,69,70, 75,_,79,75, 74,_,70,_,
			69,70,69,67, 63,_,67,_, 62,_,_,_, 62,_,_,_,
			// Section B
			81,_,79,_, 75,_,74,_, 79,_,75,74, 70,_,_,_,
			74,75,74,70, 69,_,67,_, 69,70,74,75, 79,_,_,_,
			81,_,82,81, 79,_,75,_, 74,75,79,_, 75,74,70,_,
			69,_,70,_, 74,_,69,_, 62,_,_,_, 62,63,67,69
		];
		var bassRoots = [38, 31, 39, 33, 39, 38, 31, 33];

		var ctx = null, master = null, noiseBuf = null, lead = null, echo = null;
		var on = true, started = false, step = 0, nextTime = 0;

		function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }

		// Pulse wave with the given duty cycle, like the NES square channels
		function pulseWave(duty){
			var n = 32, real = new Float32Array(n), imag = new Float32Array(n);
			for (var k = 1; k < n; k++) real[k] = 2 * Math.sin(k * Math.PI * duty) / (k * Math.PI);
			return ctx.createPeriodicWave(real, imag);
		}

		function init(){
			var AC = window.AudioContext || window.webkitAudioContext;
			if (!AC) return false;
			ctx = new AC();
			master = ctx.createGain();
			master.gain.value = VOLUME;
			master.connect(ctx.destination);
			noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
			var data = noiseBuf.getChannelData(0);
			for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
			lead = pulseWave(0.25);
			echo = pulseWave(0.125);
			return true;
		}

		function tone(wave, freq, t, dur, vol, cutoff){
			var o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
			if (typeof wave === "string") o.type = wave;
			else o.setPeriodicWave(wave);
			o.frequency.value = freq;
			f.type = "lowpass";
			f.frequency.value = cutoff;
			g.gain.setValueAtTime(0.0001, t);
			g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
			g.gain.setValueAtTime(vol, t + dur * 0.6);
			g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
			o.connect(f); f.connect(g); g.connect(master);
			// Long notes get that wobbly Simon's Quest vibrato
			if (dur > STEP * 2.5) {
				var lfo = ctx.createOscillator(), depth = ctx.createGain();
				lfo.frequency.value = 6;
				depth.gain.setValueAtTime(0, t);
				depth.gain.linearRampToValueAtTime(freq * 0.015, t + 0.18);
				lfo.connect(depth); depth.connect(o.frequency);
				lfo.start(t);
				lfo.stop(t + dur + 0.02);
			}
			o.start(t);
			o.stop(t + dur + 0.02);
		}

		// How long a melody note rings: until the next note, up to one beat
		function noteLength(s){
			var len = 1;
			while (len < 4 && melody[(s + len) % melody.length] === null) len++;
			return len * STEP * 0.92;
		}

		function noise(t, dur, vol, type, freq){
			var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
			src.buffer = noiseBuf;
			f.type = type;
			f.frequency.value = freq;
			g.gain.setValueAtTime(vol, t);
			g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
			src.connect(f); f.connect(g); g.connect(master);
			src.start(t);
			src.stop(t + dur + 0.02);
		}

		function kick(t){
			var o = ctx.createOscillator(), g = ctx.createGain();
			o.frequency.setValueAtTime(150, t);
			o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
			g.gain.setValueAtTime(0.8, t);
			g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
			o.connect(g); g.connect(master);
			o.start(t);
			o.stop(t + 0.17);
		}

		function playStep(s, t){
			var len = melody.length;
			var bar = Math.floor(s / 16) % 8, i = s % 16, note = melody[s % len];
			var sectionB = bar >= 4;

			// Pulse 1: lead melody
			if (note !== null) tone(lead, mtof(note), t, noteLength(s % len), 0.3, 6000);
			// Pulse 2: the classic NES "echo" of the melody, a dotted eighth behind
			var echoNote = melody[(s - 3 + len) % len];
			if (echoNote !== null && s >= 3) tone(echo, mtof(echoNote), t, STEP * 1.4, 0.1, 4000);
			// Triangle: bouncing octave bass on eighth notes
			if (i % 2 === 0) tone("triangle", mtof(bassRoots[bar] + (i % 4 === 2 ? 12 : 0)), t, STEP * 1.7, 0.75, 8000);
			// Noise channel drums
			if (i === 0 || i === 8 || (sectionB && i === 10)) kick(t);
			if (i === 4 || i === 12) noise(t, 0.13, 0.55, "bandpass", 1800);
			if (i % 2 === 0) noise(t, 0.03, 0.16, "highpass", 7000);
			if (sectionB && i === 15) noise(t, 0.06, 0.35, "bandpass", 2600);
		}

		function schedule(){
			if (!on) return;
			if (nextTime < ctx.currentTime - 0.2) nextTime = ctx.currentTime + 0.05;
			while (nextTime < ctx.currentTime + 0.12) {
				playStep(step, nextTime);
				nextTime += STEP;
				step++;
			}
		}

		// Browsers only allow audio after a key press or click, so this runs on the first one
		function start(){
			if (!ctx) return;
			if (ctx.state === "suspended") ctx.resume();
			if (on && !started) {
				started = true;
				nextTime = ctx.currentTime + 0.05;
				setInterval(schedule, 25);
			}
		}

		document.addEventListener("visibilitychange", function(){
			if (!ctx) return;
			if (document.hidden) ctx.suspend();
			else ctx.resume();
		});

		init();

		return {
			start: start,
			context: function(){ return ctx; },
			toggle: function(){
				on = !on;
				if (ctx) {
					master.gain.cancelScheduledValues(ctx.currentTime);
					master.gain.setTargetAtTime(on ? VOLUME : 0, ctx.currentTime, 0.02);
				}
				if (on) start();
				return on;
			},
			// Briefly turn the music down so the sound effects come through clearly
			duck: function(seconds, level){
				if (!ctx || !on) return;
				var g = master.gain, now = ctx.currentTime;
				g.cancelScheduledValues(now);
				g.setValueAtTime(g.value, now);
				g.linearRampToValueAtTime(VOLUME * level, now + 0.03);
				g.setValueAtTime(VOLUME * level, now + seconds);
				g.linearRampToValueAtTime(VOLUME, now + seconds + 0.25);
			}
		};
	})();

	// Sound effects: the original voice recordings, decoded up front with the Web Audio API
	// so they fire the instant a key is pressed. Falls back to <audio> if decoding isn't possible.
	var sfx = (function(){
		var ctx = music.context();
		var buffers = {}, offsets = {}, fallback = {}, playing = {};

		// Skip the quiet lead-in at the start of a recording: find the first 10ms window
		// with real sound, then back up 40ms so the start of the voice isn't clipped
		function firstSound(buf){
			var data = buf.getChannelData(0), win = Math.floor(buf.sampleRate * 0.01);
			for (var i = 0; i + win <= data.length; i += win) {
				var sum = 0;
				for (var j = i; j < i + win; j++) sum += data[j] * data[j];
				if (Math.sqrt(sum / win) > 0.03) return Math.max(0, i / buf.sampleRate - 0.04);
			}
			return 0;
		}

		function load(name, url){
			fallback[name] = new Audio(url);
			if (!ctx || !window.fetch) return;
			fetch(url)
				.then(function(r){ if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
				.then(function(data){ return new Promise(function(res, rej){ ctx.decodeAudioData(data, res, rej); }); })
				.then(function(buf){ offsets[name] = firstSound(buf); buffers[name] = buf; })
				.catch(function(){});
		}

		function play(name, duckSeconds, duckLevel){
			music.duck(duckSeconds, duckLevel);
			if (ctx && buffers[name]) {
				if (ctx.state === "suspended") ctx.resume();
				// Restart the clip rather than stacking copies of it
				if (playing[name]) { try { playing[name].stop(); } catch (e) {} }
				var src = ctx.createBufferSource();
				src.buffer = buffers[name];
				src.connect(ctx.destination);
				src.start(0, offsets[name]);
				playing[name] = src;
			} else if (fallback[name]) {
				var a = fallback[name];
				a.currentTime = 0;
				var p = a.play();
				if (p && p.catch) p.catch(function(){});
			}
		}

		return { load: load, play: play };
	})();

	document.addEventListener("keydown", function(){ music.start(); });
	document.getElementById("musicBtn").addEventListener("click", function(){
		var isOn = music.toggle();
		this.innerHTML = "&#9835; Music: " + (isOn ? "On" : "Off");
		this.blur();
	});
</script>

<script>

	var stepCounter = 0;
	var stepDelta = 1;
	var root = 'Resources/Audio/';
	sfx.load('punch', root + 'punch.Wav');
	sfx.load('stepLeft', root + 'StepLeft.Wav');
	sfx.load('stepRight', root + 'StepRight.Wav');
	var audioPunch = { play: function(){ sfx.play('punch', 0.5, 0.3); } };
	var audioStepLeft = { play: function(){ sfx.play('stepLeft', 0.3, 0.6); } };
	var audioStepRight = { play: function(){ sfx.play('stepRight', 0.3, 0.6); } };

	var ninjaImg = document.getElementById("ninja");
	var powImg = document.getElementById("pow");
	ninjaImg.style.position = "absolute";
	powImg.style.position = "relative";
	// Start the ninja standing in the courtyard
	ninjaImg.style.left = Math.round(window.innerWidth * 0.3) + 'px';
	ninjaImg.style.top = Math.round(window.innerHeight * 0.74) + 'px';
	var requiredRestInterval = new Date().getTime();

	document.addEventListener("keypress",function(e){
		var restInterval = new Date().getTime();
		if(requiredRestInterval+1000<restInterval && (e.keyCode < 37 || e.keyCode > 40)){
			restInterval = new Date().getTime();
			requiredRestInterval = restInterval;
			attack();
		}
	  },false);

	document.onkeydown = move;




	function punch(){

		powImg.style.backgroundPosition = '-175px 0px';
		ninjaImg.style.backgroundPosition = '-40px 0px';

		powImg.style.top = (ninjaImg.offsetTop-10).toString() + 'px';
		powImg.style.zIndex=-1;
		  var result = window.getComputedStyle(ninjaImg).transform;
		  var offset = 15;
		  if(result[7] == "-")
		  {
			offset = offset * -3;
		  }
		  powImg.style.left = (ninjaImg.offsetLeft + offset).toString() + 'px';
		var powBox = powImg.getBoundingClientRect();
		scene.hit(powBox.left + powBox.width / 2, powBox.top + powBox.height / 2);

		audioPunch.play();
	}

	function stepLeft(){
	  ninjaImg.style.backgroundPosition = '0px 0px';
	}
	function stepRight(){
		ninjaImg.style.backgroundPosition = '-126px 0px';
	}

	function standNeutral(){
		ninjaImg.style.backgroundPosition = '-85px 0px';
		powImg.style.backgroundPosition = '-230px 0px';
	}



	function attack() {
		setTimeout(punch,100);
		setTimeout(standNeutral,600);
	}

	function move(e){

		if(e.keyCode >=37 && e.keyCode <=40)
		{
			if(stepCounter>=0 && stepCounter <3)
			{
				stepRight();
				if(stepCounter == 0)
					audioStepRight.play();
			} else{
				stepLeft();
				if(stepCounter ==3)
					audioStepLeft.play();
			}

			if(stepCounter == 5)
			{
				stepDelta = -1;
			} else if (stepCounter == 0){
				stepDelta = 1;
			}

			stepCounter = stepCounter + stepDelta;
		}


		var offset = 2;
		if (e.keyCode == '38') {
			var up = ninjaImg.offsetTop - offset;
			ninjaImg.style.top = up.toString() +'px';
		}
		else if (e.keyCode == '40') {
			var down = ninjaImg.offsetTop + offset;
			ninjaImg.style.top = down.toString() +'px';
		}
		else if (e.keyCode == '37') {
			var left = ninjaImg.offsetLeft - offset;

			ninjaImg.style.left = left.toString() +'px';
			ninjaImg.style.transform = "scaleX(-1)";
		}
		else if (e.keyCode == '39') {
			var right = ninjaImg.offsetLeft + offset;
			ninjaImg.style.left = right.toString() +'px';
			ninjaImg.style.transform = "scaleX(1)";

		}
	}
</script>
